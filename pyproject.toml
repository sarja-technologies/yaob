[project]
name = "mpnstudio"
version = "0.1.0"
description = "MPN Studio: workbench and runtime for Yaob modular node networks (Fylume)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "orjson>=3.10",
  "numpy>=2.0",
  "psutil>=6.0",
]

[project.optional-dependencies]
model = ["torch", "transformers", "accelerate", "safetensors", "peft", "huggingface_hub", "nvidia-ml-py"]
dev = ["pytest>=8"]

[project.scripts]
mpn = "mpnstudio.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mpnstudio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
